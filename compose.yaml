services:
  mongo:
    image: mongo:8
    container_name: mongo
    restart: unless-stopped
    env_file:
      - ./mongoDB/.env
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./mongoDB/init:/docker-entrypoint-initdb.d:ro
  vrising:
    image: trueosiris/vrising:latest
    container_name: vrising
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "27015:27015/udp"
      - "27016:27016/udp"
    volumes:
      - ./data/server:/mnt/vrising/server
      - ./data/persistent:/mnt/vrising/persistentdata
    stdin_open: true
    tty: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
  sebastian:
    build:
      context: ./apps/sebastian
    container_name: sebastian
    restart: unless-stopped
    env_file:
      - ./apps/sebastian/.env
    depends_on:
      - vrising
  butler:
    build:
      context: ./apps/butler
    container_name: butler
    restart: unless-stopped
    volumes:
      - ./apps/butler/state:/app/state
      - ./data/persistent:/opt/vrising-server/data/persistent:ro
    env_file:
      - ./apps/butler/.env
    environment:
      TZ: Asia/Jakarta
      
volumes:
  mongo-data: